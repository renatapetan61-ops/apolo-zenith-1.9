name: APOLO ZENITH 1.9 — reconstruir corpus PT-BR

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apolo-zenith-ptbr-corpus.yml"
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: "ID de execução anterior com artifact apolo-zenith-ptbr-corpus (opcional)"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: apolo-zenith-ptbr-corpus
  cancel-in-progress: false

jobs:
  collect-ptbr:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restaurar progresso PT-BR anterior, se informado
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_run_id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          set -euo pipefail
          mkdir -p datasets_storage
          gh run download "$RESUME_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name apolo-zenith-ptbr-corpus --dir datasets_storage
      - name: Reconstruir somente português brasileiro
        run: |
          set -euo pipefail
          python datasets/corpus_builder.py \
            --saida datasets_storage \
            --max-livros-pt 120 \
            --min-documentos-idioma 15000 \
            --idiomas pt \
            --sem-wikisource
      - name: Publicar checkpoint PT-BR mesmo em caso de falha
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: apolo-zenith-ptbr-corpus
          path: datasets_storage/
          if-no-files-found: warn
          retention-days: 30
