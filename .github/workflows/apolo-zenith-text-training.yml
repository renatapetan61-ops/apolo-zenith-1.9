name: Apolo Zenith 1.9 — próxima etapa de treinamento textual

run-name: "Apolo Zenith text training after code run ${{ inputs.code_run_id || github.event.workflow_run.id || '43986715117' }}"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apolo-zenith-text-training.yml"
      - "datasets/corpus_builder.py"
      - "scripts/audit_text_corpus.py"
      - "tests/test_text_corpus_audit.py"
      - "datasets/text_loader.py"
      - "scripts/prepare_data.py"
      - "tests/test_prepare_data_sources.py"
      - "training/text_trainer.py"
      - "training/scheduler.py"
      - "tests/test_training.py"
      - "tests/test_corpus_builder.py"
      - "tests/test_text_data_split.py"
  workflow_dispatch:
    inputs:
      code_run_id:
        description: "ID do workflow de código concluído com sucesso"
        required: true
        type: string
        default: "43986715117"
  workflow_run:
    workflows:
      - "Apolo Zenith 1.9 — treinamento incremental de código"
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

# Compartilha o mesmo lock lógico do treino de código: nunca há dois treinos ativos.
# Não cancela um treinamento ativo quando um novo push/dispatch chega; a nova execução aguarda.
# A coleta usa IDs aleatórios em lotes e extrai texto separadamente; retentativas respeitam backoff.
concurrency:
  group: apolo-zenith-training
  cancel-in-progress: false

jobs:
  train-text:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    name: "Continuar o Language Core com texto"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      CODE_RUN_ID: ${{ inputs.code_run_id || github.event.workflow_run.id || '43986715117' }}
      CODE_CHECKPOINT: artifacts/code/checkpoints/actions-code-${{ inputs.code_run_id || github.event.workflow_run.id || '43986715117' }}/checkpoints/final
      REFERENCE_TEXT_RUN_ID: "44389795351"
      REFERENCE_TEXT_ARTIFACT: apolo-zenith-text-training-after-43986715117
      REFERENCE_TEXT_CHECKPOINT: artifacts/reference/checkpoints/actions-text-43986715117/checkpoints/final

    steps:
      - name: Validar identificador da execução de código
        run: |
          set -euo pipefail
          test -n "$CODE_RUN_ID"
          case "$CODE_RUN_ID" in (*[!0-9]*) echo "CODE_RUN_ID deve ser numérico"; exit 1;; esac
          echo "Checkpoint de origem: $CODE_CHECKPOINT"

      - name: Checkout do código atualizado
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar PyTorch CPU e dependências multimodais
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      - name: Validar suíte e interfaces da etapa textual
        run: |
          pytest -q
          python -m scripts.prepare_data --help
          python -m training.text_trainer --help

      - name: Recuperar o checkpoint textual de referência preservado
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.REFERENCE_TEXT_ARTIFACT }}
          run-id: ${{ env.REFERENCE_TEXT_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/reference

      - name: Validar checkpoint textual de referência e tokenizer
        run: |
          set -euo pipefail
          test -s "$REFERENCE_TEXT_CHECKPOINT/model.pt"
          test -s "$REFERENCE_TEXT_CHECKPOINT/config.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          checkpoint = Path(os.environ["REFERENCE_TEXT_CHECKPOINT"])
          model = json.loads((checkpoint / "config.json").read_text())
          tokenizer = json.loads(Path("tokenizers/tokenizer/tokenizer_meta.json").read_text())
          if int(model["vocab_size"]) != int(tokenizer["vocab_size"]):
              raise SystemExit("Checkpoint de referência e tokenizer incompatíveis.")
          print("Checkpoint textual anterior preservado e compatível.")
          PY
          mkdir -p checkpoints
          cp -a "$REFERENCE_TEXT_CHECKPOINT" checkpoints/reference-text-baseline

      - name: Coletar corpus textual com licença declarada
        run: |
          python -m datasets.corpus_builder \
            --saida datasets_storage \
            --max-livros-pt 100 \
            --max-livros-en 100 \
            --min-documentos-idioma 300 \
            --sem-wikisource

      - name: Preparar texto sem alterar o tokenizer do modelo
        run: |
          python -m scripts.prepare_data \
            --manifesto datasets_storage/manifest.json \
            --raiz datasets_storage \
            --saida datasets_storage/processed \
            --vocab 8192 \
            --proporcoes 0.90,0.05,0.05 \
            --tokenizer-existente tokenizers/tokenizer

      - name: Auditar cobertura, equilíbrio e integridade do corpus
        run: |
          python -m scripts.audit_text_corpus \
            --manifesto datasets_storage/manifest.json \
            --processado datasets_storage/processed \
            --min-documentos-idioma 300 \
            --min-tokens-treino 1000000 \
            --min-tokens-avaliacao 10000 \
            --saida reports/corpus-audit.json

      - name: Continuar o Language Core no corpus textual
        run: |
          python -m training.text_trainer \
            --dados datasets_storage/processed \
            --tokenizer datasets_storage/processed/tokenizer \
            --saida "checkpoints/actions-text-${CODE_RUN_ID}" \
            --checkpoint-inicial "$REFERENCE_TEXT_CHECKPOINT" \
            --steps 20000 \
            --batch-size 4 \
            --block-size 128 \
            --lr 0.00005 \
            --min-lr 0.000005 \
            --warmup-steps 200 \
            --early-stopping-patience 12 \
            --eval-interval 100 \
            --save-interval 250 \
            --seed 1337

      - name: Publicar checkpoint textual, métricas e proveniência
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apolo-zenith-text-training-after-${{ inputs.code_run_id || github.event.workflow_run.id || '43986715117' }}
          path: |
            checkpoints/actions-text-${{ inputs.code_run_id || github.event.workflow_run.id || '43986715117' }}/
            checkpoints/reference-text-baseline/
            datasets_storage/manifest.json
            datasets_storage/processed/resumo.json
            reports/corpus-audit.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
