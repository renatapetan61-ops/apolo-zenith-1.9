name: Apolo Zenith 1.9 — avaliação de qualidade linguística

run-name: "Apolo Zenith Language Core quality diagnostic"

on:
  workflow_run:
    workflows:
      - "Apolo Zenith 1.9 — próxima etapa de treinamento textual"
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      text_run_id:
        description: "Run ID do treinamento textual concluído"
        required: true
        type: string
        default: "44200330638"
      code_run_id:
        description: "Run ID do treinamento de código de origem"
        required: true
        type: string
        default: "43986715117"
      human_review_passed:
        description: "Aprovação humana após revisar as gerações em PT-BR e inglês"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: apolo-zenith-language-quality
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: "Holdout bilíngue, geração e diagnóstico"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      TEXT_RUN_ID: ${{ inputs.text_run_id || github.event.workflow_run.id || '44200330638' }}
      CODE_RUN_ID: ${{ inputs.code_run_id || '43986715117' }}
      HUMAN_REVIEW_PASSED: ${{ inputs.human_review_passed || false }}

    steps:
      - name: Validar identificadores
        run: |
          set -euo pipefail
          [[ "$TEXT_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$CODE_RUN_ID" =~ ^[0-9]+$ ]]

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar PyTorch CPU e dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      - name: Baixar checkpoint textual
        uses: actions/download-artifact@v4
        with:
          name: apolo-zenith-text-training-after-${{ env.CODE_RUN_ID }}
          run-id: ${{ env.TEXT_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/text

      - name: Baixar checkpoint de código
        uses: actions/download-artifact@v4
        with:
          name: apolo-zenith-code-training-${{ env.CODE_RUN_ID }}
          run-id: ${{ env.CODE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/code

      - name: Verificar arquivos e metadados
        run: |
          set -euo pipefail
          TEXT_CKPT="artifacts/text/checkpoints/actions-text-${CODE_RUN_ID}/checkpoints/final"
          CODE_CKPT="artifacts/code/checkpoints/actions-code-${CODE_RUN_ID}/checkpoints/final"
          test -s "$TEXT_CKPT/model.pt"
          test -s "$TEXT_CKPT/config.json"
          test -s "$CODE_CKPT/model.pt"
          test -s "$CODE_CKPT/config.json"
          echo "TEXT_CKPT=$TEXT_CKPT" >> "$GITHUB_ENV"
          echo "CODE_CKPT=$CODE_CKPT" >> "$GITHUB_ENV"
          REFERENCE_CKPT="artifacts/text/checkpoints/reference-text-baseline"
          test -s "$REFERENCE_CKPT/model.pt"
          test -s "$REFERENCE_CKPT/config.json"
          echo "REFERENCE_CKPT=$REFERENCE_CKPT" >> "$GITHUB_ENV"

      - name: Executar avaliação independente
        run: |
          python -m scripts.evaluate_language_quality \
            --checkpoint-text "$TEXT_CKPT" \
            --checkpoint-code "$CODE_CKPT" \
            --checkpoint-reference "$REFERENCE_CKPT" \
            --tokenizer tokenizers/tokenizer \
            --training-summary "artifacts/text/checkpoints/actions-text-${CODE_RUN_ID}/resumo_treino.json" \
            --data-summary artifacts/text/datasets_storage/processed/resumo.json \
            --human-review-passed "$HUMAN_REVIEW_PASSED" \
            --output reports/language-quality-diagnostic.json

      - name: Publicar relatório e corpus avaliado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apolo-zenith-language-quality-${{ env.TEXT_RUN_ID }}
          path: |
            reports/language-quality-diagnostic.json
            evaluation/corpus/
          if-no-files-found: warn
          retention-days: 30
