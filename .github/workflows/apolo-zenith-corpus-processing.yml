name: APOLO ZENITH 1.9 — processar corpus bilíngue existente
# Reexecução validada: preflight e processamento devem compartilhar o mesmo commit.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apolo-zenith-corpus-processing.yml"
  workflow_dispatch:
    inputs:
      merge_run_id:
        description: "Run que publicou o corpus bilíngue validado"
        required: true
        type: string
        default: "46061821358"

permissions:
  contents: read
  actions: read

concurrency:
  group: apolo-zenith-corpus-processing
  cancel-in-progress: false

jobs:
  process-audit-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 390
    env:
      MERGE_RUN_ID: ${{ inputs.merge_run_id || '46061821358' }}
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Validar e baixar o artefato bilíngue já existente
        uses: actions/download-artifact@v4
        with:
          name: apolo-zenith-bilingual-corpus-30000
          run-id: ${{ env.MERGE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: corpus-artifact

      - name: Localizar manifesto e validar proveniência
        run: |
          set -euo pipefail
          [[ "$MERGE_RUN_ID" =~ ^[0-9]+$ ]]
          MANIFEST=$(find corpus-artifact -type f -name manifest.json -print -quit)
          test -n "$MANIFEST"
          CORPUS_ROOT="$(dirname "$MANIFEST")"
          python - "$CORPUS_ROOT" "$MERGE_RUN_ID" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          provenance = json.loads((root / "corpus_provenance.json").read_text())
          records = json.loads((root / "manifest.json").read_text())
          assert provenance["documents_total"] == 30000
          assert provenance["documents_pt"] == 15000
          assert provenance["documents_en"] == 15000
          assert provenance["pt_source_run_id"] == "45906162082"
          assert provenance["en_source_run_id"] == "45485734710"
          assert len(records) == 30000
          print(json.dumps({"corpus_root": str(root), "provenance": provenance}, ensure_ascii=False))
          PY
          echo "CORPUS_ROOT=$CORPUS_ROOT" >> "$GITHUB_ENV"

      - name: Instalar PyTorch CPU e dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install pytest pyyaml

      - name: Conferir identidade do BPE original antes do processamento
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          path = Path("tokenizers/tokenizer/tokenizer.json")
          meta = json.loads(Path("tokenizers/tokenizer/tokenizer_meta.json").read_text())
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          expected = "15a4d3e9f5bdd525cb721afddf9f387ec58983474b5502a67577f8620e3a73d8"
          assert digest == expected, f"SHA-256 do BPE divergente: {digest}"
          assert meta["vocab_size"] == 8192
          assert meta["special_tokens"]["<|vision|>"] == 7
          assert meta["special_tokens"]["<|audio|>"] == 9
          print(json.dumps({"vocab_size": meta["vocab_size"], "sha256": digest}, indent=2))
          PY

      - name: Processar, filtrar, deduplicar e dividir 30.000 documentos
        run: |
          set -euo pipefail
          python -m scripts.prepare_data \
            --manifesto "$CORPUS_ROOT/manifest.json" \
            --raiz "$CORPUS_ROOT" \
            --saida "$CORPUS_ROOT/processed" \
            --vocab 8192 \
            --proporcoes 0.90,0.05,0.05 \
            --tokenizer-existente tokenizers/tokenizer

      - name: Auditar aprovação mínima, licenças, hashes e splits
        run: |
          set -euo pipefail
          mkdir -p reports
          python -m scripts.audit_text_corpus \
            --manifesto "$CORPUS_ROOT/manifest.json" \
            --processado "$CORPUS_ROOT/processed" \
            --min-documentos-idioma 15000 \
            --documentos-esperados 30000 \
            --min-documentos-processados 27000 \
            --min-tokens-treino 1000000 \
            --min-tokens-avaliacao 10000 \
            --saida reports/corpus-audit.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          original = Path("tokenizers/tokenizer")
          processed = Path(__import__("os").environ["CORPUS_ROOT"]) / "processed/tokenizer"
          def digest(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          expected = "15a4d3e9f5bdd525cb721afddf9f387ec58983474b5502a67577f8620e3a73d8"
          assert digest(original / "tokenizer.json") == expected
          assert digest(processed / "tokenizer.json") == expected
          assert json.loads((original / "tokenizer_meta.json").read_text()) == json.loads((processed / "tokenizer_meta.json").read_text())
          audit = json.loads(Path("reports/corpus-audit.json").read_text())
          assert audit["passed"] is True
          assert audit["documents"]["processed_final_documents"] >= 27000
          assert audit["documents"]["integrity_failures"] == 0
          assert audit["documents"]["duplicate_hashes"] == 0
          assert audit["tokens_by_split"]["train"] >= 1000000
          assert audit["tokens_by_split"]["val"] >= 10000
          assert audit["tokens_by_split"]["test"] >= 10000
          print("Auditoria e identidade do tokenizer aprovadas.")
          PY

      - name: Aguardar preflight aprovado no mesmo commit da main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PREFLIGHT_RUN=""
          for attempt in $(seq 1 60); do
            PREFLIGHT_RUN=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/apolo-zenith-30d-preflight.yml/runs?branch=main&per_page=50" --jq ".workflow_runs[] | select(.head_sha==\"$GITHUB_SHA\" and .conclusion==\"success\") | .id" | head -n1 || true)
            if [ -n "$PREFLIGHT_RUN" ]; then break; fi
            echo "Aguardando preflight no commit $GITHUB_SHA ($attempt/60)"
            sleep 30
          done
          test -n "$PREFLIGHT_RUN"
          echo "Preflight aprovado: $PREFLIGHT_RUN"

      - name: Executar benchmark real de CPU — 1.000 passos e 10 avaliações
        timeout-minutes: 300
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=60s 300m python -m scripts.benchmark_zenith_cpu \
            --dados "$CORPUS_ROOT/processed" \
            --tokenizer "$CORPUS_ROOT/processed/tokenizer" \
            --steps 1000 --eval-interval 100 --save-interval 100 \
            --output reports/cpu-1000-step-benchmark.json

      - name: Vincular evidências ao mesmo commit da main
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          audit = json.loads(Path("reports/corpus-audit.json").read_text())
          benchmark = json.loads(Path("reports/cpu-1000-step-benchmark.json").read_text())
          assert benchmark["status"] == "passed"
          assert benchmark["steps"] == 1000
          assert benchmark["evaluation_count"] >= 10
          assert benchmark["source_commit"] == os.environ["GITHUB_SHA"]
          audit["source_commit"] = os.environ["GITHUB_SHA"]
          audit["merge_run_id"] = os.environ["MERGE_RUN_ID"]
          audit["preflight_and_benchmark_commit"] = os.environ["GITHUB_SHA"]
          Path("reports/corpus-audit.json").write_text(json.dumps(audit, indent=2, ensure_ascii=False) + "\n")
          benchmark["merge_run_id"] = os.environ["MERGE_RUN_ID"]
          Path("reports/cpu-1000-step-benchmark.json").write_text(json.dumps(benchmark, indent=2, ensure_ascii=False) + "\n")
          print("Evidências vinculadas ao commit", os.environ["GITHUB_SHA"])
          PY

      - name: Publicar relatórios e corpus processado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apolo-zenith-corpus-processing-${{ github.run_id }}
          path: |
            reports/corpus-audit.json
            reports/cpu-1000-step-benchmark.json
            corpus-artifact/**/processed
          if-no-files-found: warn
          retention-days: 90
