name: APOLO ZENITH 1.9 — construir e auditar corpus de 30.000 documentos

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apolo-zenith-30d-corpus
  cancel-in-progress: false

jobs:
  build-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependências CPU
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Coletar pelo menos 15.000 documentos por idioma
        run: |
          python -m datasets.corpus_builder \
            --saida datasets_storage \
            --max-livros-pt 100 \
            --max-livros-en 100 \
            --min-documentos-idioma 15000 \
            --sem-wikisource
      - name: Preparar corpus sem modificar o tokenizer de referência
        run: |
          python -m scripts.prepare_data \
            --manifesto datasets_storage/manifest.json \
            --raiz datasets_storage \
            --saida datasets_storage/processed \
            --vocab 8192 \
            --proporcoes 0.90,0.05,0.05 \
            --tokenizer-existente tokenizers/tokenizer
      - name: Auditar 30.000 documentos, licenças, hashes e tokens
        run: |
          python -m scripts.audit_text_corpus \
            --manifesto datasets_storage/manifest.json \
            --processado datasets_storage/processed \
            --min-documentos-idioma 15000 \
            --documentos-esperados 30000 \
            --min-documentos-processados 27000 \
            --min-tokens-treino 1000000 \
            --min-tokens-avaliacao 10000 \
            --saida reports/corpus-audit.json
      - name: Confirmar tokenizer e integridade do pacote
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          audit = json.loads(Path("reports/corpus-audit.json").read_text())
          assert audit["passed"] is True
          assert audit["documents"]["total"] == 30000
          assert audit["documents"]["by_language"]["pt"] >= 15000
          assert audit["documents"]["by_language"]["en"] >= 15000
          original = json.loads(Path("tokenizers/tokenizer/tokenizer_meta.json").read_text())
          prepared = json.loads(Path("datasets_storage/processed/tokenizer/tokenizer_meta.json").read_text())
          assert original == prepared, "Tokenizer foi alterado durante a preparação."
          print("Corpus e tokenizer aprovados; nenhum treino foi iniciado.")
          PY
      - name: Vincular auditoria a um release imutável
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("reports/corpus-audit.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          report["release_tag"] = "apolo-zenith-corpus-30000-" + os.environ["GITHUB_RUN_ID"]
          path.write_text(json.dumps(report, indent=2, ensure_ascii=False), encoding="utf-8")
          print(report["release_tag"])
          PY
      - name: Empacotar corpus para persistência
        run: |
          set -euo pipefail
          tar -czf corpus.tar.gz datasets_storage
          SIZE=$(stat -c%s corpus.tar.gz)
          echo "Tamanho do pacote: $SIZE bytes"
          if [ "$SIZE" -gt 1000000000 ]; then
            echo "Pacote excede o limite operacional de 1 GB para release asset."
            exit 1
          fi
      - name: Publicar corpus como release asset imutável
        env:
          RELEASE_TAG: apolo-zenith-corpus-30000-${{ github.run_id }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --title "APOLO ZENITH 1.9 — corpus bilíngue de 30.000 documentos" \
            --notes "Corpus auditado e vinculado ao run $GITHUB_RUN_ID. Manifesto, hashes e licenças estão no arquivo corpus-audit.json."
          gh release upload "$RELEASE_TAG" corpus.tar.gz reports/corpus-audit.json
