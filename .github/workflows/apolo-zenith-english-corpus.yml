name: APOLO ZENITH 1.9 — coletar somente corpus inglês

on:
  workflow_dispatch:
    inputs:
      pt_run_id:
        description: "ID da execução PT-BR que publicou apolo-zenith-ptbr-corpus"
        required: true
        type: string
      resume_run_id:
        description: "ID de execução inglesa anterior para retomar (opcional)"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: apolo-zenith-english-corpus
  cancel-in-progress: false

jobs:
  collect-english:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restaurar corpus PT-BR validado
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PT_RUN_ID: ${{ inputs.pt_run_id }}
        run: |
          set -euo pipefail
          mkdir -p datasets_storage
          gh run download "$PT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name apolo-zenith-ptbr-corpus --dir datasets_storage
          test -s datasets_storage/manifest.json || test -s datasets_storage/manifest.partial.json
      - name: Restaurar progresso inglês anterior, se informado
        if: ${{ inputs.resume_run_id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          set -euo pipefail
          gh run download "$RESUME_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name apolo-zenith-english-corpus --dir datasets_storage
      - name: Coletar somente inglês — preservar PT-BR
        run: |
          set -euo pipefail
          python datasets/corpus_builder.py \
            --saida datasets_storage \
            --max-livros-en 100 \
            --min-documentos-idioma 15000 \
            --idiomas en \
            --sem-wikisource
      - name: Publicar corpus bilíngue e progresso inglês
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: apolo-zenith-english-corpus
          path: datasets_storage/
          if-no-files-found: warn
          retention-days: 30
