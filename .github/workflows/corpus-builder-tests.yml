name: APOLO ZENITH — testes do construtor de corpus

on:
  pull_request:
    branches: [main]
    paths:
      - "datasets/corpus_builder.py"
      - "tests/test_corpus_builder.py"
      - ".github/workflows/corpus-builder-tests.yml"

permissions:
  contents: read

jobs:
  corpus-builder-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar pytest
        run: python -m pip install pytest
      - name: Testar coletor e fallbacks de idioma
        run: python -m pytest -q tests/test_corpus_builder.py
      - name: Verificar sintaxe Python
        run: python -m compileall -q datasets tests/test_corpus_builder.py
