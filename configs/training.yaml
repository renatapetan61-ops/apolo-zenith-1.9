# Configuração do experimento "Apolo Language Core — Tiny".
#
# Modelo de 1.85M parâmetros, desenhado para treino em CPU/sem GPU.
# A configuração é adaptável: veja configs/training_gpu.yaml para servidores
# com GPU e a detecção automática em server/hardware_detection.py.

model:
  vocab_size: 8192
  n_layer: 4
  n_head: 4
  n_embd: 128
  n_kv_head: 4
  block_size: 256
  rope_theta: 10000.0
  rms_norm_eps: 1.0e-5
  dropout: 0.0
  tie_embeddings: true
  bias: false
  mlp_multiple_of: 64
  init_std: 0.02
  use_cache: true

training:
  saida: checkpoints/apolo-lm-tiny
  batch_size: 16
  block_size: 256
  max_steps: 700
  lr: 0.0006
  min_lr: 0.00006
  warmup_steps: 80
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  grad_accum_steps: 1
  grad_clip: 1.0
  eval_interval: 50
  log_interval: 20
  save_interval: 100
  early_stopping_patience: 5
  seed: 1337
  device: auto
  amp: auto
  num_workers: 0
  usar_otimizador_torch: false
  checkpoints_manter: 3
